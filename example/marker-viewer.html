<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rich-Diff 标记视图演示</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: #f5f7fa;
      color: #333;
      line-height: 1.6;
      min-height: 100vh;
    }

    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 20px;
      text-align: center;
    }

    .header h1 {
      font-size: 1.8rem;
      margin-bottom: 8px;
    }

    .header p {
      opacity: 0.9;
      font-size: 0.9rem;
    }

    .toolbar {
      background: white;
      padding: 16px 24px;
      border-bottom: 1px solid #e9ecef;
      display: flex;
      gap: 16px;
      align-items: center;
      flex-wrap: wrap;
    }

    .toolbar textarea {
      flex: 1;
      min-width: 200px;
      padding: 8px 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 13px;
      min-height: 60px;
      max-height: 100px;
    }

    .toolbar button {
      padding: 10px 24px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .toolbar button:hover {
      background: #5a6fd6;
    }

    .main-container {
      display: flex;
      height: calc(100vh - 180px);
      min-height: 400px;
    }

    /* 左侧标记列表 */
    .markers-panel {
      width: 320px;
      min-width: 280px;
      background: white;
      border-right: 1px solid #e9ecef;
      overflow-y: auto;
      padding: 16px;
    }

    .markers-panel h2 {
      font-size: 1rem;
      color: #666;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid #eee;
    }

    .marker-item {
      padding: 12px;
      margin-bottom: 8px;
      background: #f8f9fa;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
      border-left: 4px solid transparent;
    }

    .marker-item:hover {
      background: #e9ecef;
      transform: translateX(2px);
    }

    .marker-item.active {
      background: #e8f4ff;
      border-left-color: #1878E8;
    }

    .marker-item.add {
      border-left-color: #1878E8;
    }

    .marker-item.del {
      border-left-color: #D32F2F;
    }

    .marker-item.modify {
      border-left-color: #E65100;
    }

    .marker-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
    }

    .marker-type {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
    }

    .marker-type.add {
      background: #E8F4FF;
      color: #1878E8;
    }

    .marker-type.del {
      background: #FFEBEE;
      color: #D32F2F;
    }

    .marker-type.modify {
      background: #FFF3E0;
      color: #E65100;
    }

    .marker-field {
      font-weight: 600;
      font-size: 13px;
    }

    .marker-content {
      font-size: 12px;
      color: #666;
      margin-top: 4px;
      word-break: break-all;
    }

    .marker-content .old {
      color: #D32F2F;
    }

    .marker-content .new {
      color: #1878E8;
    }

    .empty-state {
      text-align: center;
      color: #999;
      padding: 40px 20px;
    }

    /* 右侧内容区域 */
    .content-panel {
      flex: 1;
      background: white;
      overflow-y: auto;
      padding: 24px;
    }

    .content-panel h2 {
      font-size: 1rem;
      color: #666;
      margin-bottom: 16px;
      padding-bottom: 8px;
      border-bottom: 1px solid #eee;
    }

    .diff-content {
      font-size: 15px;
      line-height: 1.8;
    }

    .diff-content ins,
    .diff-content .diff-add,
    .diff-content difftext[data-diff="add"] {
      color: #1878E8;
      background: #E8F4FF;
      text-decoration: none;
      padding: 2px 4px;
      border-radius: 3px;
      transition: background 0.2s;
    }

    .diff-content del,
    .diff-content .diff-del,
    .diff-content difftext[data-diff="del"] {
      color: #D32F2F;
      background: #FFEBEE;
      text-decoration: line-through;
      padding: 2px 4px;
      border-radius: 3px;
      transition: background 0.2s;
    }

    .diff-content .highlight {
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.4);
    }

    .diff-content p {
      margin-bottom: 12px;
    }

    /* 统计信息 */
    .stats-bar {
      display: flex;
      gap: 16px;
      padding: 12px 16px;
      background: #f8f9fa;
      border-radius: 8px;
      margin-bottom: 16px;
    }

    .stat-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
    }

    .stat-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    .stat-dot.add { background: #1878E8; }
    .stat-dot.del { background: #D32F2F; }
    .stat-dot.modify { background: #E65100; }

    /* 响应式 */
    @media (max-width: 768px) {
      .main-container {
        flex-direction: column;
        height: auto;
      }

      .markers-panel {
        width: 100%;
        min-width: auto;
        max-height: 300px;
        border-right: none;
        border-bottom: 1px solid #e9ecef;
      }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Rich-Diff 标记视图</h1>
    <p>鼠标悬浮在左侧标记上，右侧会高亮并显示连线指向具体位置</p>
  </div>

  <div class="toolbar">
    <textarea id="oldContent" placeholder="旧内容"><p>这是一段<strong>旧内容</strong>，包含一些文字。</p>
<p>第二段落内容，有一些描述。</p>
<p>第三段落保持不变。</p></textarea>
    <textarea id="newContent" placeholder="新内容"><p>这是一段<em>新内容</em>，包含一些文字。</p>
<p>第二段落已修改，有新的描述。</p>
<p>第三段落保持不变。</p>
<p>新增的第四段落。</p></textarea>
    <button onclick="runDiff()">执行对比</button>
  </div>

  <div class="main-container">
    <!-- 左侧标记列表 -->
    <div class="markers-panel">
      <h2>变更标记</h2>
      <div class="stats-bar" id="statsBar">
        <div class="stat-item"><span class="stat-dot add"></span><span id="addCount">0</span> 新增</div>
        <div class="stat-item"><span class="stat-dot del"></span><span id="delCount">0</span> 删除</div>
        <div class="stat-item"><span class="stat-dot modify"></span><span id="modifyCount">0</span> 修改</div>
      </div>
      <div id="markersList">
        <div class="empty-state">点击「执行对比」开始</div>
      </div>
    </div>

    <!-- 右侧内容区域 -->
    <div class="content-panel">
      <h2>对比结果</h2>
      <div class="diff-content" id="diffContent">
        <div class="empty-state">执行对比后显示结果</div>
      </div>
    </div>
  </div>

  <script type="module">
    import {
      diffHTML,
      generateMarkers,
      createConnector,
      clearConnectors
    } from '../dist/rich-diff.esm.js'

    // 当前状态
    let currentMarkers = []
    let currentConnector = null

    // 执行对比
    window.runDiff = function() {
      const oldContent = document.getElementById('oldContent').value
      const newContent = document.getElementById('newContent').value

      // 执行对比
      const result = diffHTML(oldContent, newContent, 'content')

      // 调试：输出 diff HTML
      console.log('Diff HTML:', result.html)
      console.log('Markers:', result.markers)

      // 渲染差异内容
      const diffContent = document.getElementById('diffContent')
      diffContent.innerHTML = result.html || '<p>无差异</p>'

      // 为每个差异元素添加唯一 ID
      annotateDiffElements(diffContent)

      // 生成标记
      currentMarkers = generateMarkers({
        diffed: { content: result.html },
        last: { content: oldContent },
        current: { content: newContent }
      })

      // 调试：输出标记
      console.log('Generated markers:', currentMarkers)

      // 渲染标记列表
      renderMarkers(currentMarkers)

      // 更新统计
      updateStats(currentMarkers)
    }

    // 为差异元素添加 ID
    function annotateDiffElements(container) {
      const elements = container.querySelectorAll('ins, del, difftext')
      elements.forEach((el, index) => {
        if (!el.id) {
          el.id = `diff-el-${index}`
        }
        // 存储差异类型
        el.dataset.diffType = el.tagName.toLowerCase() === 'ins' ? 'add' : 'del'
      })
    }

    // 渲染标记列表
    function renderMarkers(markers) {
      const listEl = document.getElementById('markersList')

      if (markers.length === 0) {
        listEl.innerHTML = '<div class="empty-state">无变更标记</div>'
        return
      }

      let html = ''
      markers.forEach((marker, index) => {
        const typeClass = marker.changeType || 'modify'
        const typeText = { add: '新增', del: '删除', modify: '修改' }[typeClass] || typeClass

        // 提取纯文本用于显示
        const oldText = extractPlainText(marker.oldValue)
        const newText = extractPlainText(marker.newValue)

        html += `
          <div class="marker-item ${typeClass}"
               data-marker-index="${index}"
               data-marker-id="${marker.id}"
               onmouseenter="highlightMarker(${index})"
               onmouseleave="clearHighlight()">
            <div class="marker-header">
              <span class="marker-type ${typeClass}">${typeText}</span>
              <span class="marker-field">${marker.fieldLabel || marker.field || '内容'}</span>
            </div>
            <div class="marker-content">
              ${oldText ? `<div class="old">- ${escapeHtml(oldText.substring(0, 60))}${oldText.length > 60 ? '...' : ''}</div>` : ''}
              ${newText ? `<div class="new">+ ${escapeHtml(newText.substring(0, 60))}${newText.length > 60 ? '...' : ''}</div>` : ''}
            </div>
          </div>
        `
      })

      listEl.innerHTML = html
    }

    // 从 HTML 中提取纯文本
    function extractPlainText(html) {
      if (!html) return ''
      // 创建临时元素解析 HTML
      const tmp = document.createElement('div')
      tmp.innerHTML = html
      return tmp.textContent || tmp.innerText || ''
    }

    // 更新统计
    function updateStats(markers) {
      const counts = { add: 0, del: 0, modify: 0 }
      markers.forEach(m => {
        const type = m.changeType || 'modify'
        counts[type] = (counts[type] || 0) + 1
      })

      document.getElementById('addCount').textContent = counts.add
      document.getElementById('delCount').textContent = counts.del
      document.getElementById('modifyCount').textContent = counts.modify
    }

    // 高亮标记
    window.highlightMarker = function(index) {
      const marker = currentMarkers[index]
      if (!marker) return

      // 清除之前的高亮和连线
      clearHighlight()

      // 高亮标记项
      const markerItem = document.querySelector(`[data-marker-index="${index}"]`)
      if (markerItem) {
        markerItem.classList.add('active')
      }

      // 查找并高亮目标元素
      const diffContent = document.getElementById('diffContent')
      let targetElement = null

      // 尝试通过 ID 查找
      if (marker.id) {
        targetElement = diffContent.querySelector(`[data-diff-id="${marker.id}"]`)
      }

      // 尝试通过选择器查找
      if (!targetElement && marker.targetSelector) {
        targetElement = diffContent.querySelector(marker.targetSelector)
      }

      // 按索引查找对应的差异元素
      if (!targetElement) {
        const diffElements = diffContent.querySelectorAll('ins, del, difftext')
        targetElement = diffElements[index] || diffElements[0]
      }

      if (targetElement) {
        // 添加高亮
        targetElement.classList.add('highlight')

        // 创建连线
        if (markerItem && window.LeaderLine) {
          try {
            currentConnector = createConnector(markerItem, targetElement, {
              color: marker.changeType === 'add' ? '#1878E8' :
                     marker.changeType === 'del' ? '#D32F2F' : '#E65100',
              size: 2,
              path: 'fluid',
              startPlug: 'disc',
              endPlug: 'arrow2',
              startPlugSize: 1.5,
              endPlugSize: 1.5,
              dash: { animation: true }
            })
          } catch (e) {
            console.warn('创建连线失败:', e)
          }
        }

        // 滚动到目标元素
        targetElement.scrollIntoView({ behavior: 'smooth', block: 'center' })
      }
    }

    // 清除高亮
    window.clearHighlight = function() {
      // 移除标记项高亮
      document.querySelectorAll('.marker-item.active').forEach(el => {
        el.classList.remove('active')
      })

      // 移除内容高亮
      document.querySelectorAll('.highlight').forEach(el => {
        el.classList.remove('highlight')
      })

      // 清除连线
      if (currentConnector) {
        try {
          currentConnector.line.remove()
        } catch (e) {}
        currentConnector = null
      }
      clearConnectors()
    }

    // HTML 转义
    function escapeHtml(str) {
      if (!str) return ''
      return str.replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
    }

    console.log('Rich-Diff 标记视图已加载')
  </script>
</body>
</html>
