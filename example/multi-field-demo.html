<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rich-Diff 多字段对比演示</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f7fa;
      color: #333;
      line-height: 1.6;
    }

    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 20px;
      text-align: center;
    }

    .header h1 {
      font-size: 1.6rem;
      margin-bottom: 8px;
    }

    .header p {
      opacity: 0.9;
      font-size: 0.9rem;
    }

    .toolbar {
      background: white;
      padding: 16px 24px;
      border-bottom: 1px solid #e9ecef;
      display: flex;
      gap: 20px;
      align-items: flex-start;
      flex-wrap: wrap;
    }

    .toolbar-section {
      flex: 1;
      min-width: 300px;
    }

    .toolbar-section h4 {
      font-size: 12px;
      color: #666;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .toolbar textarea {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 13px;
      font-family: 'Monaco', 'Menlo', monospace;
      min-height: 120px;
      max-height: 200px;
    }

    .toolbar button {
      padding: 10px 24px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .toolbar button:hover {
      background: #5a6fd6;
    }

    .main-container {
      padding: 20px;
    }

    .section-title {
      font-size: 14px;
      color: #666;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid #eee;
    }

    /* 渲染容器 */
    #diffContainer {
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      overflow: hidden;
      height: calc(100vh - 380px);
      min-height: 450px;
    }

    /* 字段配置 */
    .field-config {
      background: #f8f9fa;
      padding: 12px;
      border-radius: 6px;
      font-size: 12px;
      margin-top: 8px;
    }

    .field-config code {
      background: #e9ecef;
      padding: 2px 6px;
      border-radius: 3px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Rich-Diff 多字段对比</h1>
    <p>传入数据对象和字段配置，自动渲染表单布局的对比结果</p>
  </div>

  <div class="toolbar">
    <div class="toolbar-section">
      <h4>旧数据 (JSON)</h4>
      <textarea id="oldData">{
  "title": "原始标题",
  "subtitle": "这是副标题",
  "content": "<p>这是<strong>旧内容</strong>，包含一些文字。</p><p>第二段落内容。</p>"
}</textarea>
    </div>
    <div class="toolbar-section">
      <h4>新数据 (JSON)</h4>
      <textarea id="newData">{
  "title": "修改后的标题",
  "subtitle": "这是修改后的副标题",
  "content": "<p>这是<em>新内容</em>，包含一些文字。</p><p>第二段落已修改。</p><p>新增的第三段落。</p>"
}</textarea>
    </div>
    <div class="toolbar-section" style="min-width: 200px;">
      <h4>操作</h4>
      <button onclick="runMultiFieldDiff()">执行对比</button>
      <div class="field-config">
        <p>字段配置：</p>
        <pre style="font-size: 11px; margin: 8px 0; white-space: pre-wrap;">[
  { label: '标题', field: 'title', sort: 1 },
  { label: '副标题', field: 'subtitle', sort: 2 },
  { label: '内容', field: 'content', sort: 3 }
]</pre>
      </div>
    </div>
  </div>

  <div class="main-container">
    <div class="section-title">对比结果</div>
    <div id="diffContainer"></div>
  </div>

  <script type="module">
    // 使用 CDN 加载（发布到 npm 后可用）
    import { render } from 'https://cdn.jsdelivr.net/npm/gpower-rich-diff@1.0.2/+esm'

    // 本地开发时使用（取消下面这行注释）
    // import { render } from '../dist/rich-diff.dev.js'

    // 字段配置
    const FIELDS = [
      { label: '标题', field: 'title', sort: 1 },
      { label: '副标题', field: 'subtitle', sort: 2 },
      { label: '内容', field: 'content', sort: 3 }
    ]

    window.runMultiFieldDiff = function() {
      let oldData, newData

      try {
        oldData = JSON.parse(document.getElementById('oldData').value)
        newData = JSON.parse(document.getElementById('newData').value)
      } catch (e) {
        alert('JSON 解析错误: ' + e.message)
        return
      }

      const container = document.getElementById('diffContainer')

      // 使用新的多字段对比 API
      const result = render({
        container,
        oldData,
        newData,
        fields: FIELDS
      })

      console.log('对比结果:', result)
      console.log('字段结果:', result.fieldResults)
      console.log('标记列表:', result.markers)
    }

    // 自动执行一次
    setTimeout(() => {
      runMultiFieldDiff()
    }, 500)
  </script>
</body>
</html>
